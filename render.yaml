databases:
  - name: caresync-demo-db
    databaseName: caresync_demo_db
    user: caresync_demo_db_user
    plan: free
    region: singapore
    postgresMajorVersion: "18"

services:
  - type: web
    name: caresync-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: caresync-demo-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
